<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON//MARKET</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Basic utility styling to handle SPA navigation toggles */
        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }
    </style>
</head>

<body>

    <header>
        <h1>NEON//MARKET</h1>
        <nav>
            <!-- Changed to hash links for simple SPA routing -->
            <a href="#home" class="nav-link">Home</a>
            <a href="#products" class="nav-link">Products</a>
            <a href="#orders" class="nav-link">Orders</a>
            <a href="#login" class="nav-link">Login</a>
        </nav>
    </header>

    <main>

        <!-- HOME VIEW -->
        <section id="view-home" class="page-view active">
            <div class="hero">
                <h2>WELCOME TO NEON//MARKET</h2>
                <p>Your gateway to the digital underground.</p>
                <button id="explore-btn">Explore Products</button>
            </div>
        </section>

        <!-- PRODUCTS VIEW -->
        <section id="view-products" class="page-view">
            <h2>Products Underground</h2>
            <div id="products-list">
                <p>Loading products...</p>
            </div>
        </section>

        <!-- ORDERS VIEW -->
        <section id="view-orders" class="page-view">
            <h2>Your Orders</h2>
            <div id="orders-list">
                <!-- Frontend -> Kong -> Orders Service -->
                <p>Loading orders history...</p>
            </div>
        </section>

        <!-- LOGIN VIEW -->
        <section id="view-login" class="page-view">
            <h2>Secure Access Node</h2>
            <!-- Frontend -> Kong -> Auth/Identity Service -->
            <form id="login-form" style="max-width: 300px; display: flex; flex-direction: column; gap: 10px;">

                <input type="password" id="password" placeholder="Passkey" required style="padding: 8px;">
                <button type="submit" style="padding: 8px; cursor: pointer;">Initialize Session</button>
            </form>
            <p id="login-status" style="margin-top: 10px; font-weight: bold;"></p>
        </section>

    </main>

    <script>
        // Kong Gateway Base Endpoint
        const API_BASE_URL = "http://localhost:8000";

        // ==========================================
        // SPA ROUTER ENGINE
        // ==========================================
        const views = {
            '#home': { elementId: 'view-home', init: () => { } },
            '#products': { elementId: 'view-products', init: loadProducts },
            '#orders': { elementId: 'view-orders', init: loadOrders },
            '#login': { elementId: 'view-login', init: () => { } }
        };

        function navigateTo(hash) {
            // Default back to home view if route is empty or unknown
            const targetRoute = views[hash] ? hash : '#home';

            // Hide all active views
            document.querySelectorAll('.page-view').forEach(view => {
                view.classList.remove('active');
            });

            // Show target view layout
            const activeView = views[targetRoute];
            document.getElementById(activeView.elementId).classList.add('active');

            // Trigger fetch or initialization function for that view
            activeView.init();
        }

        // Listen for browser URL hash updates (e.g., clicking the links)
        window.addEventListener('hashchange', () => navigateTo(window.location.hash));

        // Handle direct landing or page reload
        window.addEventListener('DOMContentLoaded', () => navigateTo(window.location.hash));


        // ==========================================
        // API GATEWAY CONNECTIONS (KONG TARGETS)
        // ==========================================

        // 1. PRODUCTS API
        async function loadProducts() {
            const container = document.getElementById("products-list");
            container.innerHTML = "<p>Loading products from backend cluster...</p>";

            try {
                // Route target via Kong: e.g., Kong routes /products to your Product Service cluster
                const response = await fetch(`${API_BASE_URL}/products`);
                if (!response.ok) throw new Error(`Gateway Error: ${response.status}`);

                const products = await response.json();
                if (!products || products.length === 0) {
                    container.innerHTML = "<p>No cyber-goods available right now.</p>";
                    return;
                }

                container.innerHTML = "";
                products.forEach(product => {
                    const el = document.createElement("div");
                    el.classList.add("product");
                    el.style.border = "1px dashed #ccc";
                    el.style.padding = "10px";
                    el.style.margin = "10px 0";
                    el.innerHTML = `
                        <h3>${product.product_name}</h3>
                        <p>${product.description || ""}</p>
                        <small>Data Ref ID: ${product.id}</small>
                    `;
                    container.appendChild(el);
                });
            } catch (error) {
                console.error("Products Fetch Error:", error);
                container.innerHTML = `<p style="color: red;">Failed to bypass endpoint protection. Check Kong configs.</p>`;
            }
        }

        // 2. ORDERS API (Perfect for testing Kong authentication plugins later!)
        async function loadOrders() {
            const container = document.getElementById("orders-list");
            container.innerHTML = "<p>Retrieving secure logs...</p>";

            try {
                // Route target via Kong: e.g., Kong routes /orders to an Orders Microservice
                // Tip: Later you can test Kong's Key-Auth or JWT plugin by adding headers here!
                const response = await fetch(`${API_BASE_URL}/orders`);
                if (!response.ok) throw new Error(`Gateway Error: ${response.status}`);

                const orders = await response.json();
                if (!orders || orders.length === 0) {
                    container.innerHTML = "<p>No terminal transaction receipts found.</p>";
                    return;
                }

                container.innerHTML = "";
                orders.forEach(order => {
                    const el = document.createElement("div");
                    el.innerHTML = `<p><strong>Order #${order.id}</strong> - Status: ${order.status}</p>`;
                    container.appendChild(el);
                });
            } catch (error) {
                console.error("Orders Fetch Error:", error);
                container.innerHTML = `<p style="color: red;">Failed to retrieve transaction logs. (Expected if Gateway authentication is missing!)</p>`;
            }
        }

        // 3. LOGIN & AUTHENTICATION API
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById("login-status");
            statusEl.innerText = "Authorizing credentials...";
            statusEl.style.color = "yellow";

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                // Route target via Kong: e.g., Kong routes /auth/login to an Identity/Auth Service
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) throw new Error(`Unauthorized: ${response.status}`);

                const data = await response.json();
                statusEl.innerText = "Access Granted. Session Initialized.";
                statusEl.style.color = "green";

                // Tip: Save your token here if you implement JWT tokens on Kong later
                // localStorage.setItem('jwt_token', data.token);
            } catch (error) {
                console.error("Authentication Matrix Error:", error);
                statusEl.innerText = "Access Denied. Credentials rejected by security system.";
                statusEl.style.color = "red";
            }
        });

        // "Explore Products" Landing Button Trigger
        document.getElementById("explore-btn").addEventListener("click", () => {
            window.location.hash = "#products";
        });
    </script>

</body>

</html>
